<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'nonce-live2pet-renderer-bootstrap' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' blob: http://127.0.0.1:*; font-src 'self'; media-src 'none'; worker-src 'self' blob:;">
  <title>Live2Pet Renderer</title>
  <style>
    :root, html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #live2pet-stage { display: block; width: 100%; height: 100%; background: transparent; }
  </style>
</head>
<body>
  <canvas id="live2pet-stage"></canvas>
  <script nonce="live2pet-renderer-bootstrap">
    (() => {
      const query = new URLSearchParams(window.location.search);
      const cubismVersion = Number(query.get("cubism") || 4);
      const runtimeUrl = query.get("runtime");
      // Development loads the staged vendor directory one level up; the
      // staging script rewrites this prefix when it copies the page beside
      // the vendors for a packaged bundle.
      const vendorRoot = "../mapper-dist/vendor";
      const adapterUrl = cubismVersion === 2 ? `${vendorRoot}/cubism2.min.js` : `${vendorRoot}/cubism4.min.js`;
      const scripts = [`${vendorRoot}/pixi.min.js`, `${vendorRoot}/unsafe-eval.min.js`];
      if (runtimeUrl) {
        try {
          const parsed = new URL(runtimeUrl, window.location.href);
          if (parsed.protocol !== "http:" || parsed.hostname !== "127.0.0.1") throw new Error("Runtime URL must stay on the loopback asset server.");
          scripts.push(parsed.href);
        } catch (error) {
          window.__live2petRendererError = String(error && error.message ? error.message : error);
        }
      }
      scripts.push(adapterUrl);
      const load = src => new Promise((resolve, reject) => {
        const element = document.createElement("script");
        element.async = false;
        element.src = src;
        element.onload = resolve;
        element.onerror = () => reject(new Error(`Renderer dependency failed to load: ${src}`));
        document.head.appendChild(element);
      });
      (async () => {
        if (window.__live2petRendererError) throw new Error(window.__live2petRendererError);
        for (const src of scripts) await load(src);
        window.__live2petRendererReady = true;
      })().catch(error => {
        window.__live2petRendererError = String(error && error.message ? error.message : error);
      });
    })();
  </script>
</body>
</html>
