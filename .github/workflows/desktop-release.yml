name: Desktop CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test, typecheck, and inspect release contents
        run: pnpm test && pnpm typecheck && pnpm release:check
      - name: Validate tagged release metadata
        if: github.ref_type == 'tag'
        run: node scripts/release-metadata.cjs --tag "$GITHUB_REF_NAME"

  mac-slices:
    name: macOS ${{ matrix.arch }} slice
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Confirm runner architecture
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Package native App slice
        run: pnpm --filter @live2pet/desktop package:mac
      - name: Verify package layout and startup
        run: pnpm --filter @live2pet/desktop smoke:mac
      - name: Create downloadable DMG
        run: hdiutil create -volname Live2Pet -srcfolder "apps/desktop/out/Live2Pet-darwin-${{ matrix.arch }}/Live2Pet.app" -ov -format UDZO "Live2Pet-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: live2pet-macos-${{ matrix.arch }}
          path: Live2Pet-macOS-${{ matrix.arch }}.dmg
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64 preview
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Package Windows App
        run: pnpm --filter @live2pet/desktop package:win
      - name: Create downloadable ZIP
        shell: pwsh
        run: Compress-Archive -Path apps/desktop/out/Live2Pet-win32-x64 -DestinationPath Live2Pet-Windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: live2pet-windows-x64
          path: Live2Pet-Windows-x64.zip
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [mac-slices, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: live2pet-*
          path: release-assets
          merge-multiple: true
      - name: Validate version and prepare release notes
        run: node scripts/release-metadata.cjs --tag "$GITHUB_REF_NAME" --notes-output release-notes.md
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Live2Pet-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --notes-file release-notes.md \
            --latest \
            --title "Live2Pet ${GITHUB_REF_NAME#v}"
